<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MIXER-4 TSS Daily Check Sheet</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top left,#163b57 0%,transparent 35%),
        radial-gradient(circle at top right,#30265c 0%,transparent 35%),
        #06121e;
    color:#f4f8ff;
    min-height:100vh;
}

.container{
    width:94%;
    max-width:1200px;
    margin:auto;
}

.card{
    background:rgba(12,29,46,.96);
    border:1px solid #28445d;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

/* ================= LOGIN ================= */

#auth{
    width:100%;
    max-width:470px;
    margin:8vh auto;
    padding:28px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#91a9bf;
    font-size:13px;
    margin-bottom:25px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:20px;
}

.tab{
    padding:12px;
    border:0;
    border-radius:10px;
    background:#142b42;
    color:#b9cde0;
    font-weight:bold;
    cursor:pointer;
}

.tab.active{
    background:linear-gradient(90deg,#27d2ff,#785cff);
    color:#04131e;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:#abc0d4;
    font-size:13px;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #31516d;
    background:#091b2b;
    color:#fff;
    outline:none;
}

input:focus,
select:focus{
    border-color:#25d3ff;
    box-shadow:0 0 0 3px rgba(37,211,255,.12);
}

.btn{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:linear-gradient(90deg,#27d2ff,#785cff);
    color:#03121d;
}

.secondary{
    background:#17324b;
    color:#e7f4ff;
}

.danger{
    background:#53283a;
    color:#ffe2e8;
}

.full{
    width:100%;
}

.message{
    min-height:22px;
    margin-top:12px;
    font-size:13px;
}

.error{
    color:#ff8fa2;
}

.success{
    color:#6df0ac;
}

/* ================= APP ================= */

#app{
    display:none;
    padding-bottom:50px;
}

.top{
    padding:25px 0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.top h1{
    margin:0;
    font-size:clamp(26px,5vw,40px);
}

.top p{
    margin:6px 0 0;
    color:#91a9bf;
}

.user{
    border:1px solid #28445d;
    background:#0c2235;
    padding:9px 14px;
    border-radius:999px;
    color:#8ee7ff;
    font-size:12px;
}

.toolbar{
    padding:14px;
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.spacer{
    flex:1;
}

/* ================= SHEET ================= */

.sheet{
    padding:18px;
}

.sheet-info{
    display:grid;
    grid-template-columns:1fr 180px 180px;
    gap:12px;
    margin-bottom:18px;
}

.sheet-name{
    border:1px solid #28445d;
    background:#091b2b;
    border-radius:14px;
    padding:15px;
}

.sheet-name h2{
    margin:0 0 5px;
    font-size:18px;
}

.sheet-name small{
    color:#8fa7bc;
}

.label{
    display:block;
    color:#a9bfd2;
    font-size:12px;
    margin-bottom:6px;
}

/* ================= TABLE ================= */

/*
   IMPORTANT:
   DATE / TIME COLUMN REMOVED

   Sr | LH Check Point | Temp | RH Check Point | Temp
*/

.table-head,
.table-row{
    display:grid;
    grid-template-columns:
        55px
        minmax(190px,1fr)
        140px
        minmax(190px,1fr)
        140px;
}

.section{
    border:1px solid #294862;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:18px;
}

.section-title{
    padding:13px 15px;
    background:#102b42;
    font-weight:bold;
    font-size:13px;
}

.table-head{
    background:#081827;
    color:#91a9bf;
    font-size:11px;
    font-weight:bold;
}

.table-head div,
.table-row div{
    padding:9px;
    border-right:1px solid #294862;
    border-bottom:1px solid #294862;
}

.table-head div:last-child,
.table-row div:last-child{
    border-right:0;
}

.table-row:last-child div{
    border-bottom:0;
}

.number{
    text-align:center;
    color:#64dcff;
    font-weight:bold;
}

.point{
    font-size:12px;
    display:flex;
    align-items:center;
}

.temp{
    display:flex;
    align-items:center;
}

.temp input{
    padding:9px;
}

.empty{
    color:#526b82;
}

/* ================= BOTTOM ================= */

.bottom-fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

#saveMessage{
    min-height:20px;
    margin-top:10px;
    font-size:13px;
}

/* ================= HISTORY ================= */

.history{
    margin-top:18px;
    padding:18px;
}

.history-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.history-title h2{
    margin:0;
}

.history-card{
    border:1px solid #294862;
    background:#091b2b;
    border-radius:13px;
    padding:14px;
    margin-top:12px;
}

.history-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:10px;
}

.history-date{
    color:#66ddff;
    font-weight:bold;
}

.history-user{
    color:#a8bacb;
    font-size:12px;
}

.filled-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:8px;
}

.filled-item{
    border:1px solid #223e56;
    border-radius:9px;
    padding:9px;
    background:#071624;
    font-size:12px;
}

.filled-item b{
    color:#a9bfd2;
}

.filled-item span{
    color:#6df0ac;
    font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:850px){

    .sheet-info{
        grid-template-columns:1fr 1fr;
    }

    .sheet-name{
        grid-column:1/-1;
    }

    .table-head,
    .table-row{
        grid-template-columns:
            42px
            minmax(140px,1fr)
            105px
            minmax(140px,1fr)
            105px;
    }

}

@media(max-width:600px){

    .sheet-info{
        grid-template-columns:1fr;
    }

    .sheet-name{
        grid-column:auto;
    }

    .bottom-fields{
        grid-template-columns:1fr;
    }

    .table-head{
        display:none;
    }

    .table-row{
        grid-template-columns:40px 1fr 100px;
    }

    .left-point{
        grid-column:2/4;
        background:#0a1e30;
        font-weight:bold;
    }

    .left-temp{
        grid-column:2;
    }

    .right-point{
        grid-column:2/4;
        background:#0a1e30;
        font-weight:bold;
    }

    .right-temp{
        grid-column:3;
    }

}

/* ================= PRINT ================= */

@media print{

    body{
        background:#fff;
        color:#000;
    }

    #auth,
    .toolbar,
    .history,
    .actions,
    .user{
        display:none!important;
    }

    #app{
        display:block!important;
    }

    .sheet{
        box-shadow:none;
        border:0;
    }

    .sheet-name,
    .section-title{
        background:#fff;
        color:#000;
    }

    input,
    select{
        color:#000;
        background:#fff;
        border:0;
    }

    .table-head,
    .table-row{
        color:#000;
    }

}

</style>

/* =====================================================

    {

/* =====================================================
   HELPERS
===================================================== */

function $(id){
    return document.getElementById(id);
}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function today(){

    const d =
        new Date();

    return (
        d.getFullYear()
        + "-"
        + String(d.getMonth()+1).padStart(2,"0")
        + "-"
        + String(d.getDate()).padStart(2,"0")
    );

}


function showAuthMessage(

    type=""
){

    $("authMessage").textContent =

    $("authMessage").className =

}


function showSaveMessage(

){

    $("saveMessage").textContent =

    $("saveMessage").className =

}


/* =====================================================
   FIREBASE ERROR MESSAGE
===================================================== */

function firebaseError(error){

    console.error(error);

    const code =
        error?.code || "";


    const messages = {

        "auth/invalid-email":
            "❌ Email address galat hai.",

        "auth/user-not-found":
            "❌ Is email ka account nahi mila.",

        "auth/wrong-password":
            "❌ Password galat hai.",

        "auth/invalid-credential":
            "❌ Email ya password galat hai.",

        "auth/invalid-login-credentials":
            "❌ Email ya password galat hai.",

        "auth/email-already-in-use":
            "❌ Ye email pehle se registered hai. Login karein.",

        "auth/weak-password":
            "❌ Password minimum 6 characters ka hona chahiye.",

        "auth/network-request-failed":
            "❌ Internet connection problem.",

        "auth/too-many-requests":
            "❌ Bahut attempts ho gaye. Thodi der baad try karein.",

        "auth/operation-not-allowed":
            "❌ Firebase Console me Email/Password Login enable nahi hai.",

        "permission-denied":
            "❌ Firestore permission denied."

    };


    return (
        messages[code]
        || "❌ " + (error?.message || "Unknown Firebase error")
    );

}


/* =====================================================
   BUILD SHEET
===================================================== */

function buildSheet(){

    let valueIndex = 0;

    let html = "";


    for(
        const section
        of sections
    ){

        html += `

        <div class="section">

            <div class="section-title">
                ${escapeHTML(section.title)}
            </div>

            <div class="table-head">

                <div>Sr.</div>

                <div>
                    SCREW LH GEARBOX TEMP
                </div>

                <div>
                    TEMPERATURE (°C)
                </div>

                <div>
                    SCREW RH GEARBOX TEMP
                </div>

                <div>
                    TEMPERATURE (°C)
                </div>

            </div>
        `;


        for(
            const row
            of section.rows
        ){

            const number =
                row[0];

            const left =
                row[1];

            const right =
                row[2];


            let leftIndex = -1;
            let rightIndex = -1;


            /*
               IMPORTANT:
               Only real value cells get an index.
               Blank cells do NOT consume an index.
            */

            if(left){
                leftIndex =
                    valueIndex++;
            }


            if(right){
                rightIndex =
                    valueIndex++;
            }


            html += `

            <div class="table-row">

                <div class="number">
                    ${escapeHTML(number)}
                </div>


                <div class="point left-point">
                    ${escapeHTML(left || "—")}
                </div>


                <div class="temp left-temp">

                    ${
                        left
                        ?
                        `
                        <input
                            type="text"
                            inputmode="decimal"
                            placeholder="Value"
                            data-value="${leftIndex}">
                        `
                        :
                        ""
                    }

                </div>


                <div
                    class="point right-point
                    ${right ? "" : "empty"}">

                    ${escapeHTML(right || "—")}

                </div>


                <div class="temp right-temp">

                    ${
                        right
                        ?
                        `
                        <input
                            type="text"
                            inputmode="decimal"
                            placeholder="Value"
                            data-value="${rightIndex}">
                        `
                        :
                        ""
                    }

                </div>

            </div>

            `;

        }


        html += `
        </div>
        `;

    }


    $("sheetBody").innerHTML =
        html;

}


/* =====================================================
   CLEAR SHEET
===================================================== */

function clearSheet(){

    document
        .querySelectorAll("[data-value]")
        .forEach(
            input =>
                input.value = ""
        );


    $("checkedBy").value =
        currentUser?.email
        ?.split("@")[0]
        || "";

    $("verifiedBy").value =
        "";

}


/* =====================================================
   GET 42 VALUES
===================================================== */

function getValues(){

    const values =
        Array(42).fill("");


    document
        .querySelectorAll("[data-value]")
        .forEach(
            input => {

                values[
                    Number(input.dataset.value)
                ] =
                    input.value.trim();

            }
        );


    return values;

}


/* =====================================================
   RECORD ID
===================================================== */

function getRecordId(){

    return (
        $("sheetDate").value
        + "_"
        + $("sheetShift").value
    );

}


/* =====================================================
   SAVE RECORD
===================================================== */

async function saveRecord(
    silent=false
){

    if(!currentUser){

        return;

    }


    const date =
        $("sheetDate").value;


    const shift =
        $("sheetShift").value;


    if(!date){

        showSaveMessage(
            "❌ Please select date.",
            "error"
        );

        return;

    }


    const values =
        getValues();


    const filled =
        values.filter(
            value =>
                value !== ""
        ).length;


    await setDoc(

        doc(
            db,
            "mixer4_tss_records",
            getRecordId()
        ),

        {

            date:date,

            shift:shift,

            values:values,

            filled:filled,

            total:42,

            checkedBy:
                $("checkedBy")
                .value
                .trim(),

            verifiedBy:
                $("verifiedBy")
                .value
                .trim(),

            updatedBy:
                currentUser.uid,

            checkedByEmail:
                currentUser.email || "",

            area:
                "MIXER-4 TSS",

            updatedAt:
                serverTimestamp()

        },

        {
            merge:true
        }

    );


    if(!silent){

        showSaveMessage(
            `☁️ Saved successfully — ${filled}/42 filled`,
            "success"
        );

    }

}


/* =====================================================
   LOAD SAVED RECORD
===================================================== */

async function loadRecord(){

    if(!currentUser){
        return;
    }


    const date =
        $("sheetDate").value;


    const shift =
        $("sheetShift").value;


    clearSheet();


    try{

        const snapshot =
            await getDoc(

                doc(
                    db,
                    "mixer4_tss_records",
                    date + "_" + shift
                )

            );


        if(!snapshot.exists()){

            showSaveMessage(
                "New sheet — no saved data.",
                "success"
            );

            return;

        }


        const data =
            snapshot.data();


        const values =
            data.values || [];


        values.forEach(
            (value,index)=>{

                const input =
                    document.querySelector(
                        `[data-value="${index}"]`
                    );


                if(input){

                    input.value =
                        value || "";

                }

            }
        );


        $("checkedBy").value =
            data.checkedBy || "";


        $("verifiedBy").value =
            data.verifiedBy || "";


        showSaveMessage(
            `✓ Loaded — ${data.filled || 0}/42 filled`,
            "success"
        );


    }catch(error){

        showSaveMessage(
            firebaseError(error),
            "error"
        );

    }

}


/* =====================================================
   POINT LABEL FOR HISTORY
===================================================== */

function getPointLabel(index){

    let counter = 0;


    for(
        const section
        of sections
    ){

        for(
            const row
            of section.rows
        ){

            if(row[1]){

                if(counter === index){

                    return (
                        row[0]
                        + ". LH — "
                        + row[1]
                    );

                }

                counter++;

            }


            if(row[2]){

                if(counter === index){

                    return (
                        row[0]
                        + ". RH — "
                        + row[2]
                    );

                }

                counter++;

            }

        }

    }


    return "Point " + (index+1);

}


/* =====================================================
   HISTORY
===================================================== */

async function loadHistory(){

    $("historyList").innerHTML =
        '<div style="color:#91a9bf;padding:15px">Loading...</div>';


    try{

        let snapshot;


        try{

            snapshot =
                await getDocs(

                    query(
                        recordsRef,
                        orderBy(
                            "updatedAt",
                            "desc"
                        )
                    )

                );

        }catch(error){

            snapshot =
                await getDocs(
                    recordsRef
                );

        }


        const records = [];


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                const filled = [];


                (
                    data.values || []
                ).forEach(
                    (value,index)=>{

                        if(
                            String(
                                value || ""
                            ).trim() !== ""
                        ){

                            filled.push({

                                index:index,

                                value:
                                    String(value).trim()

                            });

                        }

                    }
                );


                /*
                   Empty records are not shown.
                */

                if(filled.length > 0){

                    records.push({

                        data:data,

                        filled:filled

                    });

                }

            }
        );


        records.sort(
            (a,b)=>
                String(
                    b.data.date || ""
                ).localeCompare(
                    String(
                        a.data.date || ""
                    )
                )
        );


        if(records.length === 0){

            $("historyList").innerHTML =
                `
                <div style="color:#91a9bf;padding:15px">
                    No filled records found.
                </div>
                `;

            return;

        }


        let html = "";


        records.forEach(
            record => {

                const data =
                    record.data;


                html += `

                <div class="history-card">

                    <div class="history-header">

                        <div class="history-date">

                            📅
                            ${escapeHTML(data.date || "")}

                            —
                            Shift
                            ${escapeHTML(data.shift || "")}

                        </div>


                        <div class="history-user">

                            👤
                            ${escapeHTML(
                                data.checkedBy
                                || data.checkedByEmail
                                || "Unknown"
                            )}

                            ·

                            ${record.filled.length}/42

                        </div>

                    </div>


                    <div class="filled-grid">

                        ${
                            record.filled
                            .map(
                                item => `

                                <div class="filled-item">

                                    <b>
                                        ${escapeHTML(
                                            getPointLabel(
                                                item.index
                                            )
                                        )}
                                    </b>

                                    <br>

                                    <span>
                                        ${escapeHTML(
                                            item.value
                                        )}
                                    </span>

                                </div>

                                `
                            )
                            .join("")
                        }

                    </div>

                </div>

                `;

            }
        );


        $("historyList").innerHTML =
            html;


    }catch(error){

        $("historyList").innerHTML =
            `
            <div class="error" style="padding:15px">
                ${escapeHTML(
                    firebaseError(error)
                )}
            </div>
            `;

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function loginUser(){

    const email =
        $("loginEmail")
        .value
        .trim();


    const password =
        $("loginPassword")
        .value;


    if(!email){

        showAuthMessage(
            "❌ Email enter karein.",
            "error"
        );

        return;

    }


    if(!password){

        showAuthMessage(
            "❌ Password enter karein.",
            "error"
        );

        return;

    }


    $("loginBtn").disabled =
        true;


    $("loginBtn").textContent =
        "Logging in...";


    showAuthMessage(
        "Please wait...",
        "success"
    );


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


    }catch(error){

        showAuthMessage(
            firebaseError(error),
            "error"
        );

    }


    $("loginBtn").disabled =
        false;


    $("loginBtn").textContent =
        "🔐 Login";

}


/* =====================================================
   CREATE ACCOUNT
===================================================== */

async function signupUser(){

    const email =
        $("signupEmail")
        .value
        .trim();


    const password =
        $("signupPassword")
        .value;


    if(!email){

        showAuthMessage(
            "❌ Email enter karein.",
            "error"
        );

        return;

    }


    if(password.length < 6){

        showAuthMessage(
            "❌ Password minimum 6 characters ka hona chahiye.",
            "error"
        );

        return;

    }


    $("signupBtn").disabled =
        true;


    $("signupBtn").textContent =
        "Creating...";


    showAuthMessage(
        "Account create ho raha hai...",
        "success"
    );


    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );


    }catch(error){

        showAuthMessage(
            firebaseError(error),
            "error"
        );

    }


    $("signupBtn").disabled =
        false;


    $("signupBtn").textContent =
        "➕ Create ID";

}

                .style

                today();


            $("sheetShift").value =
                "A";


            await loadRecord();

            $("auth")
                .style
                .display =
                "block";

                .style
                .display =
                "none";


            $("userEmail")
                .textContent =
                "";

);


/* =====================================================
   AUTO SAVE
===================================================== */

let autoSaveTimer = null;


document.addEventListener(
    "input",
    event => {

        if(
            event.target.matches(
                "[data-value],#checkedBy,#verifiedBy"
            )
        ){

            clearTimeout(
                autoSaveTimer
            );


            autoSaveTimer =
                setTimeout(
                    async ()=>{

                        if(!currentUser){
                            return;
                        }


                        try{

                            await saveRecord(true);


                            showSaveMessage(
                                "☁️ Auto-saved",
                                "success"
                            );

                        }catch(error){

                            showSaveMessage(
                                firebaseError(error),
                                "error"
                            );

                        }

                    },
                    1500
                );

        }

    }
);
