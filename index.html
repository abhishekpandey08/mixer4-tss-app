<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">

<title>MIXER-4 TSS Daily Check Sheet</title>

<style>

/* =====================================================
   MIXER-4 TSS ANIMATED UI
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --primary:#4f46e5;
  --secondary:#7c3aed;
  --cyan:#06b6d4;
  --green:#16a34a;
  --orange:#f59e0b;
  --red:#dc2626;
  --dark:#172033;
  --muted:#64748b;
  --border:#dbe4f0;
  --white:#ffffff;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  color:var(--dark);

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #e0f2fe,
      #ecfeff,
      #f5f3ff,
      #fff7ed
    );

  background-size:400% 400%;
  animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }
}


/* =====================================================
   FLOATING BACKGROUND
===================================================== */

.bg-bubble{
  position:fixed;
  border-radius:50%;
  pointer-events:none;
  z-index:-1;
  opacity:.35;
  filter:blur(2px);
}

.bubble1{
  width:180px;
  height:180px;
  background:#818cf8;
  top:8%;
  left:-60px;
  animation:float1 9s ease-in-out infinite;
}

.bubble2{
  width:140px;
  height:140px;
  background:#22d3ee;
  right:-40px;
  top:40%;
  animation:float2 11s ease-in-out infinite;
}

.bubble3{
  width:120px;
  height:120px;
  background:#c084fc;
  bottom:5%;
  left:25%;
  animation:float3 10s ease-in-out infinite;
}

@keyframes float1{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(40px,50px)}
}

@keyframes float2{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-35px,-40px)}
}

@keyframes float3{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-45px)}
}


/* =====================================================
   HEADER
===================================================== */

header{
  position:relative;
  overflow:hidden;

  color:#fff;

  padding:22px 16px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #4f46e5,
      #7c3aed,
      #0891b2
    );

  background-size:300% 300%;

  animation:headerGradient 8s ease infinite;

  box-shadow:
    0 8px 30px #312e8135;
}

@keyframes headerGradient{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

header:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  right:-70px;
  top:-90px;
  background:#ffffff20;
  animation:headerBubble 7s ease-in-out infinite;
}

@keyframes headerBubble{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.3);
  }
}

header h1{
  margin:0;
  font-size:22px;
  font-weight:850;
  letter-spacing:.2px;
}

header small{
  display:block;
  margin-top:5px;
  opacity:.92;
  font-size:12px;
}

.header-status{
  display:inline-flex;
  align-items:center;
  gap:6px;

  margin-top:10px;

  padding:6px 10px;

  border-radius:99px;

  background:#ffffff1c;

  border:1px solid #ffffff30;

  font-size:11px;

  backdrop-filter:blur(5px);
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4ade80;
  box-shadow:0 0 10px #4ade80;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
    opacity:1;
  }
  50%{
    transform:scale(1.5);
    opacity:.6;
  }
}


/* =====================================================
   LAYOUT
===================================================== */

.wrap{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:#ffffffeb;
  backdrop-filter:blur(12px);

  border:
    1px solid #ffffff;

  border-radius:20px;

  padding:18px;

  margin:13px 0;

  box-shadow:
    0 12px 35px #33415520;

  animation:cardIn .45s ease;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.hidden{
  display:none!important;
}


/* =====================================================
   AUTH SCREEN
===================================================== */

#auth{
  max-width:520px;
  margin:35px auto;
  position:relative;
  overflow:hidden;
}

.auth-logo{
  text-align:center;
  margin-bottom:20px;
}

.auth-logo-icon{
  width:75px;
  height:75px;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:22px;

  font-size:38px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed,
      #0891b2
    );

  box-shadow:
    0 10px 25px #4f46e550;

  animation:
    logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
  0%,100%{
    transform:translateY(0) rotate(0deg);
  }

  50%{
    transform:translateY(-7px) rotate(2deg);
  }
}

.auth-logo h2{
  margin:12px 0 3px;
  font-size:24px;
}

.auth-logo p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}


/* =====================================================
   TABS
===================================================== */

.tabs{
  display:flex;
  gap:8px;
  padding:5px;
  background:#eef2ff;
  border-radius:14px;
  margin-bottom:20px;
}

.tabs button{
  flex:1;
  width:auto!important;
  box-shadow:none!important;
}

.tabs .active-tab{
  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--secondary)
    );
  color:#fff;
}


/* =====================================================
   INPUTS
===================================================== */

.field{
  position:relative;
  margin:12px 0;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-weight:750;
  font-size:13px;
  color:#334155;
}

.input-wrap{
  position:relative;
}

input,
select{
  width:100%;

  padding:13px;

  border:
    1px solid var(--border);

  border-radius:13px;

  font-size:15px;

  background:#fff;

  outline:none;

  transition:
    .25s;
}

input:focus,
select:focus{
  border-color:var(--primary);

  box-shadow:
    0 0 0 4px #4f46e51a;

  transform:translateY(-1px);
}

.password-toggle{
  position:absolute;
  right:5px;
  top:5px;

  width:40px!important;
  height:40px;

  padding:0!important;

  background:#eef2ff!important;

  color:#4338ca!important;

  box-shadow:none!important;
}


/* =====================================================
   BUTTONS
===================================================== */

button{
  width:100%;

  padding:13px;

  border:0;

  border-radius:13px;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--secondary)
    );

  box-shadow:
    0 6px 16px #4f46e538;

  transition:
    transform .2s,
    box-shadow .2s,
    opacity .2s;
}

button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 9px 22px #4f46e550;
}

button:active{
  transform:scale(.97);
}

button.secondary{
  background:#e8eef8;
  color:#172033;
  box-shadow:none;
}

button.green{
  background:
    linear-gradient(
      135deg,
      #16a34a,
      #059669
    );
}

button.danger{
  background:
    linear-gradient(
      135deg,
      #ef4444,
      #b91c1c
    );
}


/* =====================================================
   MAIN APP
===================================================== */

.user-card{
  display:flex;
  align-items:center;
  gap:12px;
}

.user-avatar{
  width:48px;
  height:48px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  color:#fff;
  font-size:22px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  box-shadow:
    0 6px 15px #4f46e540;
}

.user-info{
  min-width:0;
}

.user-info b{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}


/* =====================================================
   NAVIGATION
===================================================== */

.nav{
  display:flex;
  gap:10px;

  margin:12px 0;

  position:sticky;
  top:8px;

  z-index:20;

  padding:7px;

  border-radius:16px;

  background:#ffffffdf;

  backdrop-filter:blur(12px);

  box-shadow:
    0 7px 25px #3341551c;
}

.nav button{
  flex:1;
}

.nav-icon{
  margin-right:5px;
}


/* =====================================================
   FORM HEADER
===================================================== */

.form-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.title-icon{
  width:43px;
  height:43px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  background:#eef2ff;

  font-size:22px;
}

.form-title h2{
  margin:0;
}

.form-subtitle{
  margin:4px 0 15px;
  color:var(--muted);
  font-size:13px;
}


/* =====================================================
   GRID
===================================================== */

.grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(210px,1fr)
    );

  gap:13px;
}


/* =====================================================
   CHECK POINT
===================================================== */

.point{
  position:relative;

  border:
    1px solid var(--border);

  border-left:
    5px solid var(--primary);

  border-radius:15px;

  padding:13px;

  margin:10px 0;

  background:
    linear-gradient(
      90deg,
      #f8faff,
      #fff
    );

  transition:
    transform .25s,
    box-shadow .25s,
    border-color .25s;

  animation:
    pointIn .35s ease both;
}

@keyframes pointIn{
  from{
    opacity:0;
    transform:translateX(-8px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

.point:hover{
  transform:translateY(-2px);

  box-shadow:
    0 7px 20px #2563eb18;
}

.point:nth-child(3n){
  border-left-color:var(--cyan);

  background:
    linear-gradient(
      90deg,
      #f0fdff,
      #fff
    );
}

.point:nth-child(3n+2){
  border-left-color:var(--orange);

  background:
    linear-gradient(
      90deg,
      #fffbeb,
      #fff
    );
}

.point.saved{
  border-left-color:var(--green);

  background:
    linear-gradient(
      90deg,
      #f0fdf4,
      #fff
    );
}

.point .top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
}

.point input{
  margin-top:9px;
}


/* =====================================================
   PILLS
===================================================== */

.pill{
  display:inline-flex;
  align-items:center;

  padding:5px 9px;

  border-radius:999px;

  background:#eef2ff;

  color:#4338ca;

  font-size:11px;

  font-weight:800;

  margin:2px;
}

.pill.saved{
  background:#dcfce7;
  color:#166534;
}

.pill.complete{
  background:#dbeafe;
  color:#1d4ed8;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-card{
  margin:14px 0;

  padding:13px;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #f5f3ff
    );

  border:1px solid #ddd6fe;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;

  font-size:13px;
  font-weight:750;
}

.progress-bar{
  height:10px;

  background:#ddd6fe;

  border-radius:99px;

  overflow:hidden;
}

.progress-fill{
  height:100%;

  width:0%;

  border-radius:99px;

  background:
    linear-gradient(
      90deg,
      #2563eb,
      #7c3aed,
      #06b6d4
    );

  background-size:200% 100%;

  animation:
    progressGlow 2s linear infinite;

  transition:
    width .4s ease;
}

@keyframes progressGlow{
  0%{
    background-position:0% 0;
  }

  100%{
    background-position:200% 0;
  }
}


/* =====================================================
   SAVE STATUS
===================================================== */

.save-status{
  display:inline-flex;
  align-items:center;
  gap:7px;

  min-height:30px;

  padding:5px 10px;

  border-radius:99px;

  background:#f1f5f9;

  color:#64748b;

  font-size:12px;

  font-weight:700;
}

.save-spinner{
  width:13px;
  height:13px;

  border:
    2px solid #cbd5e1;

  border-top-color:
    var(--primary);

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =====================================================
   HISTORY
===================================================== */

.history-header{
  display:flex;
  align-items:center;
  gap:10px;
}

.history-header h2{
  margin:0;
}

.history-item{
  padding:15px;

  border:
    1px solid var(--border);

  border-radius:16px;

  margin:10px 0;

  background:#fff;

  box-shadow:
    0 4px 15px #3341550d;

  transition:
    .25s;

  animation:
    cardIn .4s ease;
}

.history-item:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 22px #33415518;
}

.history-date{
  font-weight:850;
  font-size:15px;
}

.history-user{
  color:var(--muted);
  font-size:12px;
  margin:5px 0;
}

.history-actions{
  display:flex;
  gap:8px;
}

.history-actions button{
  margin-top:8px;
}


/* =====================================================
   EMPTY / LOADING
===================================================== */

.loading-box{
  text-align:center;
  padding:30px 10px;
}

.loader{
  width:42px;
  height:42px;

  margin:auto;

  border:
    4px solid #e0e7ff;

  border-top-color:
    var(--primary);

  border-right-color:
    var(--secondary);

  border-radius:50%;

  animation:
    spin .8s linear infinite;
}

.empty{
  text-align:center;

  padding:30px 15px;

  color:var(--muted);
}

.empty-icon{
  font-size:40px;
  margin-bottom:8px;
}


/* =====================================================
   MESSAGE
===================================================== */

.ok{
  color:#15803d;
  font-weight:750;
}

.err{
  color:#dc2626;
  font-weight:700;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.small{
  font-size:12px;
}


/* =====================================================
   COMPLETE BUTTON
===================================================== */

.complete-area{
  margin-top:18px;

  padding-top:15px;

  border-top:
    1px dashed #cbd5e1;
}

#finishBtn{
  background:
    linear-gradient(
      135deg,
      #16a34a,
      #059669
    );
}


/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;

  left:50%;

  bottom:25px;

  transform:
    translate(-50%,120px);

  z-index:100;

  padding:12px 18px;

  border-radius:99px;

  color:#fff;

  background:#172033;

  box-shadow:
    0 10px 30px #0004;

  font-size:13px;

  font-weight:700;

  opacity:0;

  transition:
    .35s;
}

#toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  header{
    padding:18px 13px;
  }

  header h1{
    font-size:19px;
  }

  .wrap{
    padding:10px;
  }

  .card{
    padding:14px;
    border-radius:17px;
  }

  .nav{
    top:5px;
  }

  .nav button{
    font-size:12px;
    padding:11px 7px;
  }

  .row{
    flex-wrap:wrap;
  }

  .row button{
    width:auto;
  }

  .point{
    padding:11px;
  }

  .point .top{
    align-items:flex-start;
  }

  .point .top b{
    font-size:13px;
  }

  #auth{
    margin:18px auto;
  }

  .user-card{
    align-items:flex-start;
  }

  .history-actions{
    flex-direction:column;
  }

  .history-actions button{
    width:100%!important;
  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

  *,
  *:before,
  *:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }

}

</style>
</head>


<body>

<!-- ANIMATED BACKGROUND -->

<div class="bg-bubble bubble1"></div>
<div class="bg-bubble bubble2"></div>
<div class="bg-bubble bubble3"></div>


<!-- HEADER -->

<header>

  <div class="wrap">

    <h1>
      🧪 MIXER-4 TSS Daily Check Sheet
    </h1>

    <small>
      Cloud • Secure Login • Auto-save • History
    </small>

    <div class="header-status">

      <span class="online-dot"></span>

      <span>
        Online Cloud System
      </span>

    </div>

  </div>

</header>


<div class="wrap">


<!-- =====================================================
     LOGIN / SIGNUP
===================================================== -->

<section
  id="auth"
  class="card"
>


  <div class="auth-logo">

    <div class="auth-logo-icon">
      🧪
    </div>

    <h2>
      MIXER-4 TSS
    </h2>

    <p>
      Daily Maintenance Check System
    </p>

  </div>


  <div class="tabs">

    <button
      id="loginTab"
      class="active-tab"
    >
      🔐 Login
    </button>

    <button
      id="signupTab"
      class="secondary"
    >
      ➕ Create ID
    </button>

  </div>


  <!-- LOGIN -->

  <div id="loginBox">

    <div class="field">

      <label>
        Email ID
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

    </div>


    <div class="field">

      <label>
        Password
      </label>

      <div class="input-wrap">

        <input
          id="loginPass"
          type="password"
          placeholder="Enter password"
          autocomplete="current-password"
        >

        <button
          type="button"
          class="password-toggle"
          id="loginEye"
        >
          👁️
        </button>

      </div>

    </div>


    <button id="loginBtn">

      🚀 Login to Dashboard

    </button>

  </div>


  <!-- SIGNUP -->

  <div
    id="signupBox"
    class="hidden"
  >

    <p class="muted">

      Create your own account.
      Every engineer/operator can use
      their own email ID.

    </p>


    <div class="field">

      <label>
        Email ID
      </label>

      <input
        id="signupEmail"
        type="email"
        placeholder="Enter email ID"
        autocomplete="email"
      >

    </div>


    <div class="field">

      <label>
        Password
      </label>

      <div class="input-wrap">

        <input
          id="signupPass"
          type="password"
          placeholder="Minimum 6 characters"
          autocomplete="new-password"
        >

        <button
          type="button"
          class="password-toggle"
          id="signupEye"
        >
          👁️
        </button>

      </div>

    </div>


    <button id="signupBtn">

      ✨ Create Account

    </button>

  </div>


  <p
    id="authMsg"
    class="small"
  ></p>


</section>



<!-- =====================================================
     MAIN APPLICATION
===================================================== -->

<section
  id="app"
  class="hidden"
>


  <!-- USER -->

  <div class="card">

    <div class="user-card">

      <div class="user-avatar">
        👷
      </div>

      <div class="user-info">

        <b id="userLabel">
          User
        </b>

        <div class="muted">
          Logged-in Engineer / Operator
        </div>

      </div>


      <button
        class="secondary"
        id="logoutBtn"
        style="margin-left:auto;width:auto"
      >
        🚪 Logout
      </button>

    </div>

  </div>



  <!-- NAVIGATION -->

  <div class="nav">

    <button id="newBtn">

      📝
      <span class="nav-icon">
        New Sheet
      </span>

    </button>


    <button
      class="secondary"
      id="historyBtn"
    >

      📚
      <span class="nav
