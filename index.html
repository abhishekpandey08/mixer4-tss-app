<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MIXER-4 TEST</title>

  <style>
    body{
      font-family:Arial;
      text-align:center;
      padding:40px 20px;
      background:#eef2ff;
    }

    button{
      display:block;
      width:100%;
      max-width:350px;
      margin:15px auto;
      padding:16px;
      border:0;
      border-radius:12px;
      background:#2563eb;
      color:white;
      font-size:18px;
      font-weight:bold;
    }

    #result{
      margin-top:25px;
      padding:15px;
      background:white;
      border-radius:12px;
      font-weight:bold;
    }
  </style>
</head>

<body>

<h1>🚀 MIXER-4 TSS</h1>

<p>Website Button Test</p>

<button onclick="testButton()">
  TEST BUTTON
</button>

<button onclick="testSecond()">
  SECOND BUTTON
</button>

<div id="result">
  अभी कोई button नहीं दबाया गया।
</div>

<script>

function testButton(){
  document.getElementById("result").innerHTML =
    "✅ BUTTON WORKING";
}

function testSecond(){
  document.getElementById("result").innerHTML =
    "🎉 JAVASCRIPT WORKING";
}

</script>

</body>
</html>
