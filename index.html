<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIXER-4 TSS Daily Check Sheet</title>

<style>
:root{
  --bg:#07111f;
  --card:#0d1b2d;
  --line:#28445f;
  --text:#edf6ff;
  --muted:#9eb3c9;
  --a:#25d0ff;
  --b:#7c5cff;
  --good:#36e58d;
  --bad:#ff667d;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,#153455,transparent 35%),
    radial-gradient(circle at 90% 10%,#241d52,transparent 35%),
    var(--bg);
  min-height:100vh;
}

.container{
  width:min(1250px,94%);
  margin:auto;
}

.card{
  background:rgba(13,27,45,.95);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 20px 60px #0006;
}

/* LOGIN */

.auth{
  max-width:520px;
  margin:8vh auto;
  padding:30px;
}

.auth h2{
  margin-top:0;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:20px 0;
}

button{
  border:0;
  border-radius:11px;
  padding:12px 16px;
  font-weight:700;
  cursor:pointer;
}

.tab{
  background:#142a42;
  color:#abc;
}

.tab.active,
.primary{
  background:linear-gradient(90deg,var(--a),var(--b));
  color:#03121e;
}

.secondary{
  background:#19324d;
  color:#dceeff;
}

.danger{
  background:#522336;
  color:#ffdce2;
}

input,
select{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid #31506e;
  background:#091827;
  color:#fff;
  outline:0;
}

input:focus,
select:focus{
  border-color:var(--a);
  box-shadow:0 0 0 3px rgba(37,208,255,.1);
}

label{
  display:block;
  font-size:13px;
  color:#b9cde0;
  margin-bottom:6px;
}

.field{
  margin:12px 0;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.msg{
  min-height:22px;
  margin-top:10px;
  font-size:13px;
}

.error{
  color:#ff9cac;
}

.success{
  color:#6ff0ae;
}

/* APP */

#app{
  display:none;
  padding-bottom:50px;
}

header{
  padding:28px 0 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

header h1{
  margin:0;
  font-size:clamp(25px,4vw,42px);
}

header p{
  color:var(--muted);
  margin:7px 0;
}

.pill{
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:999px;
  color:#bfeaff;
}

.toolbar{
  padding:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.spacer{
  flex:1;
}

/* SHEET */

.sheet{
  padding:18px;
}

.sheet-top{
  display:grid;
  grid-template-columns:1fr 180px 180px;
  gap:12px;
  margin-bottom:18px;
}

.sheet-title{
  padding:16px;
  border-radius:14px;
  background:#0a1929;
  border:1px solid var(--line);
}

.sheet-title h2{
  margin:0 0 5px;
  font-size:19px;
}

.sheet-title small{
  color:var(--muted);
}

.section{
  margin:18px 0;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}

.section-title{
  padding:12px 14px;
  background:#10283d;
  font-weight:800;
}

.grid-head,
.row{
  display:grid;

  /*
    DATE / TIME COLUMN REMOVED
    New columns:
    Sr | LH Point | LH Temp | RH Point | RH Temp
  */

  grid-template-columns:
    55px
    minmax(200px,1fr)
    145px
    minmax(200px,1fr)
    145px;
}

.grid-head{
  background:#081726;
  color:#9eb3c9;
  font-size:12px;
  font-weight:700;
}

.grid-head>div,
.row>div{
  padding:9px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.grid-head>div:last-child,
.row>div:last-child{
  border-right:0;
}

.row:last-child>div{
  border-bottom:0;
}

.row{
  font-size:13px;
}

.num{
  text-align:center;
  font-weight:bold;
  color:#6bdcff;
}

.blank{
  color:#61778e;
}

.row input{
  padding:8px;
  border-radius:8px;
}

.actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

/* HISTORY */

.history{
  margin-top:20px;
  padding:18px;
}

.history h2{
  margin:0 0 14px;
}

.history-card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin:10px 0;
}

.history-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.history-head strong{
  color:#75e4ff;
}

.filled-list{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));
  gap:8px;
  margin-top:10px;
}

.item{
  padding:9px;
  background:#091827;
  border:1px solid #203a53;
  border-radius:9px;
}

.item b{
  color:#b7c9da;
}

.item span{
  color:#6ff0ae;
  font-weight:bold;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:15px;
}

.hidden{
  display:none!important;
}

/* MOBILE */

@media(max-width:900px){

  .sheet-top{
    grid-template-columns:1fr 1fr;
  }

  .sheet-title{
    grid-column:1/-1;
  }

  .grid-head,
  .row{
    grid-template-columns:
      42px
      minmax(140px,1fr)
      105px
      minmax(140px,1fr)
      105px;
  }
}

@media(max-width:650px){

  .form-row,
  .sheet-top{
    grid-template-columns:1fr;
  }

  .grid-head{
    display:none;
  }

  .row{
    grid-template-columns:40px 1fr 1fr;
  }

  .row .left-label,
  .row .right-label{
    grid-column:2/4;
    font-weight:bold;
    background:#0a1929;
  }

  .row .left-temp,
  .row .right-temp{
    grid-column:auto;
  }
}

/* PRINT */

@media print{

  body{
    background:#fff;
    color:#000;
  }

  .auth,
  .toolbar,
  .history,
  .actions,
  .pill{
    display:none!important;
  }

  #app{
    display:block!important;
  }

  .sheet{
    box-shadow:none;
    border:0;
    padding:0;
  }

  .sheet-title,
  .section-title{
    background:#fff;
    color:#000;
  }

  .grid-head,
  .row{
    color:#000;
  }

  .grid-head>div,
  .row>div{
    border-color:#777;
  }

  .row input{
    border:0;
    background:#fff;
    color:#000;
  }
}
</style>
</head>

/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

  storageBucket:
    "mixer4-tss.firebasestorage.app",

    "1:281329772926:web:c2321755e3ad4d54236b2f"

};


const fb =

const auth =
  getAuth(fb);

const db =
  getFirestore(fb);

const records =
  collection(db,"mixer4_tss_records");


const $ =
  id => document.getElementById(id);


let user = null;
let timer;


/* ================= ORIGINAL CHECK POINTS ================= */

const sections = [

],

["20",

"3rd stage bearing outside"],

["21",

]
],


[
"TSS CALENDAR ROLL GEARBOX FLS",
[

["23",

"FLS oil temp"]

]
]

];


/* ================= HELPERS ================= */

const esc =
  s =>
    String(s ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );


function today(){

  const d =
    new Date();

  return (
    d.getFullYear()
    + "-"
    + String(d.getMonth()+1).padStart(2,"0")
    + "-"
    + String(d.getDate()).padStart(2,"0")
  );

}


function msg(id,text,type=""){

  $(id).textContent =
    text;

  $(id).className =
    "msg " + type;

}


function firebaseError(e){

  const errors = {

    "auth/invalid-credential":
      "Email/ID ya password galat hai.",

    "auth/invalid-login-credentials":
      "Email/ID ya password galat hai.",

    "auth/email-already-in-use":

    "permission-denied":

  };

  return errors[e?.code]
    || e?.message
    || "Unknown error";

}


/* ================= BUILD SHEET ================= */

function buildSheet(){

  let index = 0;

  let html = "";

  for(
    const [title,rows]
    of sections
  ){

    html += `
      <div class="section">

      ${
        title
        ?
        `<div class="section-title">
          ${esc(title)}
        </div>`
        :
        ""
      }

      <div class="grid-head">

        <div>Sr.</div>

        <div>
          SCREW LH GEARBOX TEMP
        </div>

        <div>
          TEMPERATURE (°C)
        </div>

        <div>
          SCREW RH GEARBOX TEMP
        </div>

        <div>
          TEMPERATURE (°C)
        </div>

      </div>
    `;


    for(const r of rows){

      const leftIndex =
        index++;

      const rightIndex =
        index++;


      html += `

        <div class="row">

          <div class="num">
            ${r[0]}
          </div>


          <div class="left-label">
            ${esc(r[1])}
          </div>


          <div class="left-temp">

            ${
              r[1]
              ?
              `
              <input
                data-v="${leftIndex}"
                type="text"
                inputmode="decimal"
                placeholder="Value">
              `
              :
              ""
            }

          </div>


          <div
            class="right-label
            ${r[2] ? "" : "blank"}">

            ${esc(r[2] || "—")}

          </div>


          <div class="right-temp">

            ${
              r[2]
              ?
              `
              <input
                data-v="${rightIndex}"
                type="text"
                inputmode="decimal"
                placeholder="Value">
              `
              :
              ""
            }

          </div>

        </div>

      `;

    }

    html += `
      </div>
    `;

  }


  $("sheetBody").innerHTML =
    html;

}


/* ================= CLEAR SHEET ================= */

function clearSheet(){

  document
    .querySelectorAll("[data-v]")
    .forEach(
      x => x.value = ""
    );


  $("checkedBy").value =
    user?.email?.split("@")[0] || "";


  $("verifiedBy").value =
    "";

}


/* ================= COLLECT VALUES ================= */

function collectValues(){

  const values =
    Array(42).fill("");


  document
    .querySelectorAll("[data-v]")
    .forEach(
      x =>
        values[
          +x.dataset.v
        ] =
        x.value.trim()
    );


  return values;

}


/* ================= RECORD ID ================= */

function recordId(){

  return (
    $("sheetDate").value
    + "_"
    + $("sheetShift").value
  );

}


/* ================= SAVE ================= */

async function saveRecord(
  silent=false
){

  if(!user)
    return;


  const date =
    $("sheetDate").value;


  if(!date){

    msg(
      "saveMsg",
      "Please select date.",
      "error"
    );

    return;

  }


  const values =
    collectValues();


  const filled =
    values.filter(Boolean).length;


  await setDoc(

    doc(
      db,
      "mixer4_tss_records",
      recordId()
    ),

    {

      date,

      shift:
        $("sheetShift").value,

      values,

      filled,

      total:42,

      checkedBy:
        $("checkedBy").value.trim(),

      verifiedBy:
        $("verifiedBy").value.trim(),

      checkedByEmail:
        user.email || "",

      updatedBy:
        user.uid,

      updatedAt:
        serverTimestamp(),

      area:
        "MIXER-4 TSS"

    },

    {
      merge:true
    }

  );


  if(!silent){

    msg(
      "saveMsg",
      `Saved to cloud ✓ ${filled}/42 points filled`,
      "success"
    );

  }

}


/* ================= LOAD RECORD ================= */

async function loadRecord(
  date,
  shift
){

  clearSheet();


  $("sheetDate").value =
    date;

  $("sheetShift").value =
    shift;


  try{

    const snap =
      await getDoc(
        doc(
          db,
          "mixer4_tss_records",
          date + "_" + shift
        )
      );


    if(!snap.exists()){

      msg(
        "saveMsg",
        "New sheet — no saved record.",
        "success"
      );

      return;

    }


    const data =
      snap.data();


    (
      data.values || []
    ).forEach(
      (value,index)=>{

        const el =
          document.querySelector(
            `[data-v="${index}"]`
          );

        if(el)
          el.value =
            value || "";

      }
    );


    $("checkedBy").value =
      data.checkedBy || "";


    $("verifiedBy").value =
      data.verifiedBy || "";


    msg(
      "saveMsg",
      `Loaded ✓ ${data.filled || 0}/42 points filled`,
      "success"
    );


  }catch(e){

    console.error(e);

    msg(
      "saveMsg",
      firebaseError(e),
      "error"
    );

  }

}


/* ================= HISTORY LABEL ================= */

function pointLabel(index){

  let count = 0;


  for(
    const [,rows]
    of sections
  ){

    for(
      const row
      of rows
    ){

      if(count++ === index){

        return (
          row[0]
          + ". LH: "
          + row[1]
        );

      }


      if(count++ === index){

        return (
          row[0]
          + ". RH: "
          + row[2]
        );

      }

    }

  }


  return "Point " + (index+1);

}


/* ================= HISTORY ================= */

async function loadHistory(){

  $("historyList").innerHTML =
    '<div class="loading">Loading shared history...</div>';


  try{

    let snap;


    try{

      snap =
        await getDocs(
          query(
            records,
            orderBy(
              "updatedAt",
              "desc"
            )
          )
        );

    }catch(e){

      snap =
        await getDocs(records);

    }


    const history =
      [];


    snap.forEach(
      item => {

        const data =
          item.data();


        const filled =
          [];


        (
          data.values || []
        ).forEach(
          (value,index)=>{

            if(
              String(
                value || ""
              ).trim()
            ){

              filled.push([
                index,
                String(value).trim()
              ]);

            }

          }
        );


        if(filled.length){

          history.push({
            data,
            filled
          });

        }

      }
    );


    history.sort(
      (a,b)=>
        String(
          b.data.date
        ).localeCompare(
          String(a.data.date)
        )
    );


    if(!history.length){

      $("historyList").innerHTML =
        '<div class="loading">No filled records yet.</div>';

      return;

    }


    $("historyList").innerHTML =
      history.map(
        item => `

          <div class="history-card">

            <div class="history-head">

              <strong>
                ${esc(item.data.date)}
                —
                Shift
                ${esc(item.data.shift)}
              </strong>

              <span>
                ${esc(item.data.checkedBy || "Unknown")}
                ·
                ${item.filled.length}/42 filled
              </span>

            </div>


            <div class="filled-list">

              ${
                item.filled.map(
                  point => `

                    <div class="item">

                      <b>
                        ${esc(
                          pointLabel(point[0])
                        )}
                      </b>

                      <br>

                      <span>
                        ${esc(point[1])}
                      </span>

                    </div>

                  `
                ).join("")
              }

            </div>

          </div>

        `
      ).join("");


  }catch(e){

    console.error(e);

    $("historyList").innerHTML =
      `
      <div class="msg error">
        ${esc(firebaseError(e))}
      </div>
      `;

  }

}


/* ================= LOGIN ================= */

async function loginUser(){

  const email =
    $("loginEmail")
    .value
    .trim();


  const password =
    $("loginPassword")
    .value;


  if(!email || !password){

    msg(
      "authMsg",
      "Email aur password enter karein."
    );

    return;

  }


  msg(
    "authMsg",
    "Logging in...",
    "success"
  );


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(e){

    console.error(e);

    msg(
      "authMsg",
      firebaseError(e),
      "error"
    );

  }

}


/* ================= CREATE ID ================= */

async function signupUser(){

  const email =
    $("signupEmail")
    .value
    .trim();


  const password =
    $("signupPassword")
    .value;


  if(!email || !password){

    msg(
      "authMsg",
      "Email aur password enter karein."
    );

    return;

  }


  if(password.length < 6){

    msg(
      "authMsg",
      "Password kam se kam 6 characters ka hona chahiye."
    );

    return;

  }


  msg(
    "authMsg",
    "Creating ID...",
    "success"
  );


  try{

    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(e){

    console.error(e);

    msg(
      "authMsg",
      firebaseError(e),
      "error"
    );

  }

}


/* Inline compatibility */

window.loginUser =
  loginUser;

window.signupUser =
  signupUser;

$("loginTab").onclick =

    $("loginTab")
      .classList

    $("signupTab")
      .classList
      .remove("active");


    $("loginBox")
      .classList
      .remove("hidden");

    $("signupBox")
      .classList
      .add("hidden");


    $("authMsg").textContent =
      "";

  };


$("signupTab").onclick =
  () => {

    $("signupTab")
      .classList
      .add("active");

    $("loginTab")
      .classList
      .remove("active");


    $("signupBox")
      .classList
      .remove("hidden");

    $("loginBox")
      .classList
      .add("hidden");


    $("authMsg").textContent =
      "";

  };

$("loginPassword").onkeydown =
  e => {

    if(e.key === "Enter")
      loginUser();

  };


$("signupPassword").onkeydown =
  e => {

    if(e.key === "Enter")
      signupUser();

  };

$("logoutBtn").onclick =

/* ================= AUTO SAVE ================= */

document.addEventListener(
  "input",
  e => {

    if(
      e.target.matches(
        "[data-v],#checkedBy,#verifiedBy"
      )
    ){

      clearTimeout(timer);


      timer =
        setTimeout(
          async () => {

            try{

              await saveRecord(true);

              msg(
                "saveMsg",
                "Auto-saved ✓",
                "success"
              );

            }catch(error){

              console.error(error);

              msg(
                "saveMsg",
                firebaseError(error),
                "error"
              );

            }

          },
          1200
        );

    }

  }
);


/* ================= AUTH STATE ================= */

onAuthStateChanged(
  auth,
  current => {

    user =
      current;


    if(current){

      $("auth")
        .style
        .display =
        "none";


      $("app")
        .style
        .display =
        "block";


      $("userLabel")
        .textContent =
        current.email
        || "Logged in";


      loadRecord(
        $("sheetDate").value,
        $("sheetShift").value
      );


    }else{

      $("auth")
        .style
        .display =
        "block";


      $("app")
        .style
        .display =
        "none";

    }

  }
);


/* ================= START ================= */

buildSheet();

$("sheetDate").value =
  today();
