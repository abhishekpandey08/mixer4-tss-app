<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firebase Login Test</title>

<style>
body{
  font-family:Arial;
  background:#eef2ff;
  padding:25px 15px;
}
.card{
  max-width:450px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 25px #0002;
}
input,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}
button{
  background:#2563eb;
  color:white;
  border:0;
  font-weight:bold;
}
#result{
  margin-top:15px;
  padding:15px;
  border-radius:10px;
  background:#f1f5f9;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="card">

<h2>🔐 Firebase Login Test</h2>

<input
  id="email"
  type="email"
  placeholder="Email">

<input
  id="password"
  type="password"
  placeholder="Password">

<button id="create">
Create Account
</button>

<button id="login">
Login
</button>

<div id="result">
Waiting...
</div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDztHV-dnII1DeUoxsworjfWqOcYUw8tY",

  authDomain:
    "mixer4-tss.firebaseapp.com",

  projectId:
    "mixer4-tss",

  storageBucket:
    "mixer4-tss.firebasestorage.app",

  messagingSenderId:
    "281329772926",

  appId:
    "1:281329772926:web:c2321755e3ad4d54236b2f"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


const result =
  document.getElementById("result");


function show(text,ok=false){

  result.innerHTML =
    text;

  result.style.background =
    ok ? "#dcfce7" : "#fee2e2";

  result.style.color =
    ok ? "#166534" : "#991b1b";

}


/* CREATE */

document
.getElementById("create")
.addEventListener(
  "click",
  async () => {

    const email =
      document
      .getElementById("email")
      .value
      .trim();

    const password =
      document
      .getElementById("password")
      .value;

    show("⏳ Creating account...");

    try{

      const user =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      show(
        "🟢 ACCOUNT CREATED!<br><br>" +
        "Email: " +
        user.user.email +
        "<br><br>" +
        "UID: " +
        user.user.uid,
        true
      );

    }
    catch(error){

      show(
        "🔴 CREATE ACCOUNT ERROR<br><br>" +
        "Code: " +
        error.code +
        "<br><br>" +
        error.message
      );

    }

  }
);


/* LOGIN */

document
.getElementById("login")
.addEventListener(
  "click",
  async () => {

    const email =
      document
      .getElementById("email")
      .value
      .trim();

    const password =
      document
      .getElementById("password")
      .value;

    show("⏳ Logging in...");

    try{

      const user =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      show(
        "🟢 LOGIN SUCCESSFUL!<br><br>" +
        "Email: " +
        user.user.email +
        "<br><br>" +
        "UID: " +
        user.user.uid,
        true
      );

    }
    catch(error){

      show(
        "🔴 LOGIN ERROR<br><br>" +
        "Code: " +
        error.code +
        "<br><br>" +
        error.message
      );

    }

  }
);

</script>

</body>
</html>
